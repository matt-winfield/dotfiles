# Synology NAS. `ssh nas` and `ssh -p 8034 Matt@192.168.1.150` both match.
Host nas 192.168.1.150
    HostName 192.168.1.150
    Port 8034
    User Matt
    # tmux sets TERM=tmux-256color, which DSM has no terminfo entry for (and
    # no tic to install one), so bash falls back to a dumb terminal and
    # backspace inserts a space. Send a TERM the NAS does know.
    SetEnv TERM=xterm-256color
