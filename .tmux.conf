# Ghostty's tab keys (cmd+t, cmd+1-9, ...) are remapped to send these
# bindings, see ~/.config/ghostty/config.ghostty

# Colours and terminal features
set -g default-terminal "tmux-256color"

# Pass modified keys like shift+enter through to programs instead of turning
# them into plain keys (Claude Code uses shift+enter for a newline)
set -s extended-keys always
set -s extended-keys-format csi-u

set -g focus-events on
set -g set-clipboard on

# Don't delay escape (makes vim/neovim mode switches instant)
set -sg escape-time 10

set -g mouse on
set -g history-limit 50000

# Emacs copy mode drops the character under the cursor, so a left-to-right
# drag is one character short on the right. Vi mode keeps that character.
setw -g mode-keys vi
# Same blue as the active tab, instead of tmux's default yellow highlight.
setw -g copy-mode-selection-style "bg=#8caaee,fg=#303446"

# Don't copy on mouse release. The highlight stays until cmd+c (Ghostty sends
# ctrl+shift+c as CSI-u, which extended-keys above already parses) or until
# q / escape leaves copy mode without copying.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word }
bind -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line }
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi C-S-c send-keys -X copy-selection-and-cancel
# Outside copy mode this swallows cmd+c so it is not typed into the shell.
# In copy mode the key is handled by the binding above.
bind -n C-S-c if-shell -F "#{==:#{pane_mode},copy-mode}" { send-keys -X copy-selection-and-cancel }

# Number windows from 1 to match cmd+1-9, and close gaps when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Name windows after the pane title like Ghostty tabs do. Programs set it
# (e.g. Claude Code's session name), as does Ghostty's shell integration
# (loaded in ~/.zshrc) with the current directory or running command.
setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_title}"
set -g set-titles on
set -g set-titles-string "#S: #W"

# Open new windows and splits in the current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New session in the current directory. Asks for a name, then switches to it.
bind S command-prompt -p "Session name:" { new-session -s "%%" -c "#{pane_current_path}" }

# Close the current pane without the y/n prompt (used by cmd+w)
bind X kill-pane

bind r source-file ~/.tmux.conf \; display "Reloaded tmux config"

# Cheat sheet of the bindings above (also cmd+/ in Ghostty).
# -w 58 fits cheat sheet lines up to 54 characters (2 for the border, 2 for a
# right margin). -h is the border plus the lines plus one spare row: the
# newline after the last line scrolls the first line off the top without it.
# Widen or heighten the popup if cheatsheet.txt outgrows it, or its lines
# will wrap or scroll.
bind h display-popup -b rounded -T " Shortcuts " -w 58 -h 39 -E "bash -c 'tput civis; cat ~/dotfiles/.config/tmux/cheatsheet.txt; read -rsn1'"

# Status bar shown as a tab bar at the top, Catppuccin Frappe colours
set -g status-position top
set -g status-style "bg=#292c3c,fg=#c6d0f5"
set -g status-left "#[fg=#8caaee,bold] #S "
# Key hints while the session/window list (ctrl+b s, ctrl+b w) is open
set -g status-right-length 100
set -g status-right "#{?#{==:#{pane_mode},tree-mode},#[fg=#e5c890]enter#[fg=#a5adce] open  #[fg=#e5c890]x#[fg=#a5adce] close (then y)  #[fg=#e5c890]ctrl+h#[fg=#a5adce] help  #[fg=#e5c890]q#[fg=#a5adce] back ,}"
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#8caaee,fg=#303446,bold] #I #W "
set -g pane-active-border-style "fg=#8caaee"

# Make prompts like "Kill session main? (y/n)" stand out from the tab bar
set -g message-style "bg=#e5c890,fg=#303446,bold"
set -g message-command-style "bg=#e5c890,fg=#303446,bold"
